<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>शुभ निमंत्रण - रीडायरेक्ट हो रहा है...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var l = window.location;
      var path = l.pathname;
      var segments = path.split('/').filter(Boolean);
      var repoBase = segments.length > 0 ? '/' + segments[0] + '/' : '/';
      l.replace(repoBase + (l.search || '') + (l.hash || ''));
    </script>
  </head>
  <body style="background-color: #1a0f12; color: #ffd700; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
    <div>
      <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">शुभ निमंत्रण</h2>
      <p style="color: #fef08a; font-size: 0.9rem;">डिजिटल कार्ड लोड हो रहा है, कृपया प्रतीक्षा करें...</p>
    </div>
  </body>
</html>
