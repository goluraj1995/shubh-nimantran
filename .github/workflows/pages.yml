
name: Deploy Shubh Nimantran v31

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v31 parts
        run: |
          set -e

          test "$(stat -c%s shubh_nimantran_v31_part1.bin)" -eq 16741432
          test "$(stat -c%s shubh_nimantran_v31_part2.bin)" -eq 16741432
          test "$(stat -c%s shubh_nimantran_v31_part3.bin)" -eq 16741432
          test "$(stat -c%s shubh_nimantran_v31_part4.bin)" -eq 16741432
          test "$(stat -c%s shubh_nimantran_v31_part5.bin)" -eq 16741432

          echo "add3ce5aef007526037e50edd30e2f0831db98660a6e9e26b97a55d298218353  shubh_nimantran_v31_part1.bin" | sha256sum -c -
          echo "3b005cd002fd97ad02501f9e690c547f8728fa5923b0077141cab09ac061c20e  shubh_nimantran_v31_part2.bin" | sha256sum -c -
          echo "105791c022781aa9c512122a49c74c047577bd56e620f22547290402767aea25  shubh_nimantran_v31_part3.bin" | sha256sum -c -
          echo "642d634f77248faa98ef98e30a78d34205f3fc8cbae2106fe11709d4e731ad00  shubh_nimantran_v31_part4.bin" | sha256sum -c -
          echo "77efcafe85ffe98500f7844bd36852233cc8735ae6378672d6cc6ff73a94a74d  shubh_nimantran_v31_part5.bin" | sha256sum -c -

      - name: Rebuild and verify v31 ZIP
        run: |
          set -e

          cat shubh_nimantran_v31_part1.bin shubh_nimantran_v31_part2.bin shubh_nimantran_v31_part3.bin shubh_nimantran_v31_part4.bin shubh_nimantran_v31_part5.bin > shubh_nimantran_dist_v31.zip

          test "$(stat -c%s shubh_nimantran_dist_v31.zip)" -eq 83707160

          echo "579e9e7d02f548218fe9b662e9787e57027b6600cf020023cc3a297aa356c610  shubh_nimantran_dist_v31.zip" | sha256sum -c -

          unzip -t shubh_nimantran_dist_v31.zip

      - name: Extract website ZIP
        run: |
          set -e
          mkdir -p site
          unzip -o shubh_nimantran_dist_v31.zip -d site
          test -f site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
