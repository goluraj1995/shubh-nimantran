
name: Deploy Shubh Nimantran v30

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v30 parts
        run: |
          set -e

          test "$(stat -c%s v30part1.bin)" -eq 17000000
          test "$(stat -c%s v30part2.bin)" -eq 17000000
          test "$(stat -c%s v30part3.bin)" -eq 17000000
          test "$(stat -c%s v30part4.bin)" -eq 17000000
          test "$(stat -c%s v30part5.bin)" -eq 16231289

          echo "49fb7f987fa04aeb959f51ebc8e75f4c70203cec11d9ae9fb403035cc0ff5404  v30part1.bin" | sha256sum -c -
          echo "afb865452982ec37c2db2a767944175af7c381093f171353a5e18bf08c71c4ef  v30part2.bin" | sha256sum -c -
          echo "a8ce7db13caea42cdf9deb25413fe4e35c707d6a0d43fe439b8cef14d7b2d99b  v30part3.bin" | sha256sum -c -
          echo "c57d6813c9db59a6daa07de712df8952465559813f093eaaa5df69aaec1dc183  v30part4.bin" | sha256sum -c -
          echo "80295ced74996f75dad006a8866ab813474f7b38732cb4b0e2de8de377f0dec2  v30part5.bin" | sha256sum -c -

      - name: Rebuild and verify v30 ZIP
        run: |
          set -e

          cat v30part1.bin v30part2.bin v30part3.bin v30part4.bin v30part5.bin > shubh_nimantran_dist_v30.zip

          test "$(stat -c%s shubh_nimantran_dist_v30.zip)" -eq 84231289

          echo "a352bdcfce18f054f392296b98cf4c775a08b5448de515c3a4df2c80621d5fca  shubh_nimantran_dist_v30.zip" | sha256sum -c -

          unzip -t shubh_nimantran_dist_v30.zip

      - name: Extract website ZIP
        run: |
          set -e
          mkdir -p site
          unzip -o shubh_nimantran_dist_v30.zip -d site
          test -f site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
