
name: Deploy Shubh Nimantran v29

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v29 parts
        run: |
          test "$(stat -c%s v29part1.bin)" -eq 17825792
          test "$(stat -c%s v29part2.bin)" -eq 17825792
          test "$(stat -c%s v29part3.bin)" -eq 17825792
          test "$(stat -c%s v29part4.bin)" -eq 17825792
          test "$(stat -c%s v29part5.bin)" -eq 12925241

          echo "a214de3936fd01a60a51944a4733e3fa6cfcf38c26ecb26939223dfd3986159d  v29part1.bin" | sha256sum -c -
          echo "51f4c7bee4fe7dc87b22df9040ccfecb766fc88994b58fff23355b66862c3426  v29part2.bin" | sha256sum -c -
          echo "d43995504f05080d3320b5a73a8178de3d91f5e0a3d1c041c74fee7a85f1a864  v29part3.bin" | sha256sum -c -
          echo "4d64978fc0f094029789202698bfd075bd533f4124503a5647cc628aba188e94  v29part4.bin" | sha256sum -c -
          echo "71474232cc52d0ab9a024884d2f8f4fda8f3ee8cbc12f0da9c5119bdbd07897b  v29part5.bin" | sha256sum -c -

      - name: Rebuild and verify v29 ZIP
        run: |
          cat v29part1.bin v29part2.bin v29part3.bin v29part4.bin v29part5.bin > shubh_nimantran_dist_v29.zip

          test "$(stat -c%s shubh_nimantran_dist_v29.zip)" -eq 84228409

          echo "0db846da76cba5a68f6e04e40eccbfb280e9940056a3a2f0c96b13a51b24c8ad  shubh_nimantran_dist_v29.zip" | sha256sum -c -

          unzip -t shubh_nimantran_dist_v29.zip

      - name: Extract website ZIP
        run: |
          mkdir -p site
          unzip -o shubh_nimantran_dist_v29.zip -d site
          test -f site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
