name: Deploy Shubh Nimantran

on:
push:
branches: [main]
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: pages
cancel-in-progress: false

jobs:
deploy:
runs-on: ubuntu-latest
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Rebuild and verify v28 ZIP
    run: |
      cat v28part1.bin v28part2.bin v28part3.bin v28part4.bin v28part5.bin > shubh_nimantran_dist_v28.zip
      test "$(stat -c%s shubh_nimantran_dist_v28.zip)" -eq 84042285
      unzip -t shubh_nimantran_dist_v28.zip
  - name: Extract website ZIP
    run: |
      mkdir -p site
      unzip -o shubh_nimantran_dist_v28.zip -d site
      test -f site/index.html
      test -f site/index.html
  - name: Configure Pages
    uses: actions/configure-pages@v5
  - name: Upload website files
    uses: actions/upload-pages-artifact@v3
    with:
      path: site
  - name: Deploy website
    id: deployment
    uses: actions/deploy-pages@v4
