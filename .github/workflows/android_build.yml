
name: Shubh Nimantran Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/android_build.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Find and prepare project
        shell: bash
        run: |
          set -e

          echo "Checking repository files..."
          find . -maxdepth 4 -type f | head -n 100

          PROJECT_DIR="$(find . -type f -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE="$(find . -maxdepth 5 -type f -iname '*.zip' \
              -not -path '*/.git/*' -print -quit)"

            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting project ZIP: $ZIP_FILE"
              mkdir -p _android_source
              unzip -oq "$ZIP_FILE" -d _android_source
            fi

            PROJECT_DIR="$(find . -type f -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/.git/*' \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No package.json found."
            echo "The Android source files may not be uploaded or extracted."
            echo "Repository files are listed above in this log."
            exit 1
          fi

          echo "Project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          npx cap sync android

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found in the Android project."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shubh-Nimantran-debug
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
