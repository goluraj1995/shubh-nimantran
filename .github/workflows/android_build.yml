
name: Shubh Nimantran Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'www/**'
      - '.github/workflows/android_build.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Shubh Nimantran APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare website files
        shell: bash
        run: |
          set -e

          mkdir -p www

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -name 'shubh_nimantran_dist*.zip' \
            -print | sort -V | tail -n 1)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Using website archive: $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d www
          fi

          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html not found."
            exit 1
          fi

          echo "Website files are ready."
          ls -la www

      - name: Install Capacitor dependencies
        shell: bash
        run: |
          set -e
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Create Android project
        shell: bash
        run: |
          set -e

          if [ ! -f capacitor.config.json ]; then
            echo "ERROR: capacitor.config.json is missing."
            exit 1
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd android

          if [ ! -f gradlew ]; then
            echo "ERROR: Android Gradle wrapper was not generated."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shubh-Nimantran-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
