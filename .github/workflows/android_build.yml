
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      -       - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Find project and install dependencies
        shell: bash
        run: |
          PROJECT_DIR="$(find . -name package.json -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit | xargs dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shubh-Nimantran-debug
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
